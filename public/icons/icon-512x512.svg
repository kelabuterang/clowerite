<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ECFDF5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2D2319" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="115" fill="url(#glow)" />
  
  <!-- Subtle Clover Texture / Geometry in Corners -->
  <g opacity="0.18">
    <circle cx="90" cy="90" r="45" fill="#FFFFFF" />
    <circle cx="422" cy="90" r="35" fill="#FFFFFF" />
    <circle cx="90" cy="422" r="35" fill="#FFFFFF" />
    <circle cx="422" cy="422" r="45" fill="#FFFFFF" />
  </g>

  <!-- Inner Neomorphic Badge -->
  <rect x="28" y="28" width="456" height="456" rx="90" stroke="#2D2319" stroke-width="8" stroke-opacity="0.15" fill="none" />

  <!-- Shadow below Mascot -->
  <ellipse cx="256" cy="430" rx="130" ry="24" fill="#2D2319" opacity="0.2" />

  <!-- MASCOT GROUP -->
  <g transform="translate(256, 260) scale(3.5)" filter="url(#dropShadow)">
    <g transform="translate(-50, -50)">
      <!-- Clover Hood (Cape) -->
      <path d="M22 55 C20 40 30 18 50 18 C70 18 80 40 78 55 C78 72 68 82 50 82 C32 82 22 72 22 55 Z" fill="#047857" stroke="#2D2319" stroke-width="2.5" />
      <path d="M25 58 C23 45 32 23 50 23 C68 23 77 45 75 58 C75 70 66 78 50 78 C34 78 25 70 25 58 Z" fill="#10B981" />

      <!-- Sprouting Clover Stem & 4-Leaf Crown -->
      <path d="M50 20 Q53 9 60 7" stroke="#047857" stroke-width="3" stroke-linecap="round" fill="none" />
      <g transform="translate(60, 7) rotate(15) scale(0.85)">
        <path d="M0 0 C-4 -6 -10 -6 -10 0 C-10 6 0 10 0 10 C0 10 10 6 10 0 C10 -6 4 -6 0 0 Z" fill="#10B981" transform="rotate(0)" />
        <path d="M0 0 C-4 -6 -10 -6 -10 0 C-10 6 0 10 0 10 C0 10 10 6 10 0 C10 -6 4 -6 0 0 Z" fill="#059669" transform="rotate(90)" />
        <path d="M0 0 C-4 -6 -10 -6 -10 0 C-10 6 0 10 0 10 C0 10 10 6 10 0 C10 -6 4 -6 0 0 Z" fill="#10B981" transform="rotate(180)" />
        <path d="M0 0 C-4 -6 -10 -6 -10 0 C-10 6 0 10 0 10 C0 10 10 6 10 0 C10 -6 4 -6 0 0 Z" fill="#34D399" transform="rotate(270)" />
        <circle cx="0" cy="0" r="3" fill="#F59E0B" />
      </g>

      <!-- White Mochi Body -->
      <ellipse cx="50" cy="54" rx="22" ry="19" fill="#FFFFFF" stroke="#2D2319" stroke-width="2.5" />
      
      <!-- Rosy Cheeks -->
      <circle cx="36" cy="57" r="3.5" fill="#FDA4AF" />
      <circle cx="64" cy="57" r="3.5" fill="#FDA4AF" />

      <!-- Smart Round Glasses -->
      <circle cx="40" cy="51" r="6.2" stroke="#2D2319" stroke-width="2.2" fill="rgba(255,255,255,0.75)" />
      <circle cx="60" cy="51" r="6.2" stroke="#2D2319" stroke-width="2.2" fill="rgba(255,255,255,0.75)" />
      <line x1="46.2" y1="51" x2="53.8" y2="51" stroke="#2D2319" stroke-width="2.2" />

      <!-- Sparkly Eyes -->
      <circle cx="40" cy="51" r="2.8" fill="#2D2319" />
      <circle cx="60" cy="51" r="2.8" fill="#2D2319" />
      <circle cx="41.3" cy="49.5" r="1.1" fill="#FFFFFF" />
      <circle cx="61.3" cy="49.5" r="1.1" fill="#FFFFFF" />

      <!-- Happy Smile -->
      <path d="M47 58 Q50 61.5 53 58" stroke="#2D2319" stroke-width="2" fill="none" stroke-linecap="round" />

      <!-- Tiny Hands holding Golden Clover Medallion -->
      <ellipse cx="36" cy="67" rx="4.5" ry="3.5" fill="#FFFFFF" stroke="#2D2319" stroke-width="2" />
      <ellipse cx="64" cy="67" rx="4.5" ry="3.5" fill="#FFFFFF" stroke="#2D2319" stroke-width="2" />
      
      <!-- Scarf knot with Golden Star -->
      <rect x="43" y="66" width="14" height="7" rx="3.5" fill="#D97706" stroke="#2D2319" stroke-width="1.8" />
      <circle cx="50" cy="69.5" r="2.5" fill="#FDE68A" />
    </g>
  </g>
</svg>
